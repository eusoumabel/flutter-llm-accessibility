# Round 2: taxonomy with severity, prompts v2 (output in Brazilian Portuguese, severity field, P1 reports only the most severe violation).
experiment:
  id: EXP_ROUND_02
  round: round_02
  dataset_version: "0.1"
  taxonomy_version: "1.1"
  prompts:
    P0: prompts/v2/P0_zero_shot.md
    P1: prompts/v2/P1_guidelines.md
  repetitions: 1

models:
  - provider: gemini
    model_id: gemini-2.5-flash
    temperature: 0
    thinking: provider default
  - provider: claude
    model_id: claude-opus-5-5
    effort: low
    temperature: not supported
    fallback: disabled

response_schema: prompts/v2/response_schema.json

execution:
  randomized: true
  store_raw_response: true
  store_normalized_response: true

created_at: "2026-11-10"
