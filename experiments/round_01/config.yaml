# Round 1, run as the pilot. Raw responses keep the original id EXP_PILOT_001.
experiment:
  id: EXP_PILOT_001
  round: round_01
  dataset_version: "0.1"
  taxonomy_version: "1.0"
  prompts:
    P0: prompts/v1/P0_zero_shot.md
    P1: prompts/v1/P1_guidelines.md
  repetitions: 1

models:
  - provider: gemini
    model_id: gemini-2.5-flash
    temperature: 0
    thinking: provider default
  - provider: claude
    model_id: claude-opus-5-5
    effort: low
    temperature: not supported
    fallback: disabled

response_schema: prompts/v1/response_schema.json

execution:
  randomized: true
  store_raw_response: true
  store_normalized_response: true

created_at: "2026-09-30"
